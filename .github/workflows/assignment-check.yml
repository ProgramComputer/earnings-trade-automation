name: Check PAPER assignment reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'assignment_recovery.py'
      - 'trade_workflow.py'
      - 'alpaca_integration.py'
      - 'test_assignment_recovery.py'
      - '.github/workflows/assignment-check.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_PAPER: 'true'
      APCA_API_BASE_URL: 'https://paper-api.alpaca.markets'
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline tests
        env:
          APCA_API_KEY_ID: 'test-key'
          APCA_API_SECRET_KEY: 'test-secret'
        run: python -m unittest discover -q
      - name: Check broker records without changing state
        run: python trade_workflow.py --reconcile-only
