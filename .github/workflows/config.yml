name: Earnings Trade Automation

on:
  schedule:
    - cron: '40 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '45 14 * * 1-5'
      timezone: 'America/New_York'
    - cron: '15 15 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      mode:
        description: 'PAPER workflow mode'
        required: true
        default: 'reconcile-only'
        type: choice
        options:
          - reconcile-only
          - paper-trade

permissions:
  contents: write

concurrency:
  group: earnings-trade-automation-paper
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      ALPACA_PAPER: 'true'
      APCA_API_BASE_URL: 'https://paper-api.alpaca.markets'
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
      GOOGLE_SCRIPT_SECRET: ${{ secrets.GOOGLE_SCRIPT_SECRET }}
      MANUAL_MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm PAPER-only configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ALPACA_PAPER}" != "true" ]]; then
            echo "::error::Trading is disabled because ALPACA_PAPER is not exactly true."
            exit 78
          fi
          if [[ "${APCA_API_BASE_URL}" != "https://paper-api.alpaca.markets" ]]; then
            echo "::error::Trading is disabled because the configured Alpaca endpoint is not the PAPER endpoint."
            exit 78
          fi
          if [[ -z "${APCA_API_KEY_ID}" || -z "${APCA_API_SECRET_KEY}" ]]; then
            echo "::error::Required Alpaca PAPER credentials are not configured."
            exit 78
          fi

      - name: Check Alpaca PAPER market clock
        id: market
        shell: bash
        run: |
          set -euo pipefail
          clock_file="${RUNNER_TEMP}/alpaca-paper-clock.json"
          curl --silent --show-error --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --header "APCA-API-KEY-ID: ${APCA_API_KEY_ID}" \
            --header "APCA-API-SECRET-KEY: ${APCA_API_SECRET_KEY}" \
            --output "${clock_file}" \
            "${APCA_API_BASE_URL}/v2/clock"

          if ! jq -e '(.is_open | type) == "boolean"' "${clock_file}" >/dev/null; then
            echo "::error::Alpaca PAPER clock returned an invalid response."
            exit 69
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${MANUAL_MODE}" in
              reconcile-only)
                echo "run_mode=reconcile-only" >> "${GITHUB_OUTPUT}"
                echo "Manual dispatch is restricted to read-only reconciliation."
                ;;
              paper-trade)
                echo "run_mode=paper-trade" >> "${GITHUB_OUTPUT}"
                echo "Manual dispatch explicitly selected PAPER trading."
                ;;
              *)
                echo "run_mode=invalid" >> "${GITHUB_OUTPUT}"
                ;;
            esac
          elif [[ "$(jq -r '.is_open' "${clock_file}")" == "true" ]]; then
            echo "run_mode=paper-trade" >> "${GITHUB_OUTPUT}"
            echo "Alpaca PAPER clock confirms the market is open."
          else
            echo "run_mode=market-closed" >> "${GITHUB_OUTPUT}"
            next_open="$(jq -r '.next_open // "unknown"' "${clock_file}")"
            echo "::notice::Alpaca PAPER clock reports the market closed; this scheduled run is a neutral skip. Next open: ${next_open}."
          fi

      - name: Validate workflow mode
        shell: bash
        env:
          RUN_MODE: ${{ steps.market.outputs.run_mode }}
        run: |
          set -euo pipefail
          case "${RUN_MODE}" in
            paper-trade|reconcile-only|market-closed) ;;
            *)
              echo "::error::Workflow mode is empty or unrecognized; refusing all operational steps."
              exit 78
              ;;
          esac
          echo "Validated workflow mode: ${RUN_MODE}."

      - name: Set up Python 3.10
        if: steps.market.outputs.run_mode == 'paper-trade' || steps.market.outputs.run_mode == 'reconcile-only'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.market.outputs.run_mode == 'paper-trade' || steps.market.outputs.run_mode == 'reconcile-only'
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          python -m pip install --disable-pip-version-check -r requirements.txt
          finished_at="$(date +%s)"
          echo "Dependency installation took $((finished_at-started_at)) seconds."

      - name: Wait for PAPER entry window
        if: >-
          steps.market.outputs.run_mode == 'paper-trade' &&
          github.event_name == 'schedule' &&
          (github.event.schedule == '45 14 * * 1-5' || github.event.schedule == '15 15 * * 1-5')
        shell: bash
        run: |
          set -euo pipefail
          clock_file="${RUNNER_TEMP}/alpaca-paper-entry-clock.json"

          while true; do
            curl --silent --show-error --fail \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --retry-max-time 120 \
              --header "APCA-API-KEY-ID: ${APCA_API_KEY_ID}" \
              --header "APCA-API-SECRET-KEY: ${APCA_API_SECRET_KEY}" \
              --output "${clock_file}" \
              "${APCA_API_BASE_URL}/v2/clock"

            if ! jq -e '
              (.is_open | type) == "boolean" and
              (.timestamp | type) == "string" and
              (.next_close | type) == "string"
            ' "${clock_file}" >/dev/null; then
              echo "::error::Alpaca PAPER clock returned an invalid entry-window response."
              exit 69
            fi

            if [[ "$(jq -r '.is_open' "${clock_file}")" != "true" ]]; then
              echo "::notice::Alpaca PAPER market closed while waiting; continuing for a neutral application-level skip."
              exit 0
            fi

            broker_now="$(jq -r '.timestamp' "${clock_file}")"
            next_close="$(jq -r '.next_close' "${clock_file}")"
            broker_now_epoch="$(date --date="${broker_now}" +%s)"
            next_close_epoch="$(date --date="${next_close}" +%s)"
            entry_epoch=$((next_close_epoch - 25 * 60))
            cutoff_epoch=$((next_close_epoch - 3 * 60))

            if (( broker_now_epoch >= cutoff_epoch )); then
              echo "::notice::The PAPER entry cutoff has passed; continuing for reconciliation and position management only."
              exit 0
            fi

            if (( broker_now_epoch >= entry_epoch )); then
              echo "Alpaca PAPER clock confirms the 25-minute entry window is open."
              exit 0
            fi

            wait_seconds=$((entry_epoch - broker_now_epoch))
            if (( wait_seconds > 60 )); then
              wait_seconds=60
            fi
            echo "Waiting ${wait_seconds} seconds for the Alpaca PAPER entry window."
            sleep "${wait_seconds}"
          done

      - name: Run PAPER trading workflow
        id: trading
        if: steps.market.outputs.run_mode == 'paper-trade' || steps.market.outputs.run_mode == 'reconcile-only'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          if [[ "${{ steps.market.outputs.run_mode }}" == "reconcile-only" ]]; then
            python trade_workflow.py --reconcile-only
          else
            python trade_workflow.py
          fi
          workflow_status=$?
          if [[ "${workflow_status}" -eq 4 ]]; then
            echo "safety_failure=true" >> "${GITHUB_OUTPUT}"
          else
            echo "safety_failure=false" >> "${GITHUB_OUTPUT}"
          fi
          exit "${workflow_status}"

      - name: Sync optional Sheet outbox
        if: always() && steps.market.outputs.run_mode == 'paper-trade'
        continue-on-error: true
        shell: bash
        run: python trade_workflow.py --sync-sheet

      - name: Commit durable ledger updates
        id: persist
        if: always() && (steps.market.outputs.run_mode == 'paper-trade' || steps.market.outputs.run_mode == 'reconcile-only') && hashFiles('trades.db') != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- trades.db

          if git diff --cached --quiet; then
            echo "No trades.db changes to commit."
            exit 0
          fi

          git commit -m "chore: persist PAPER trading ledger [skip ci]"
          push_succeeded=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              push_succeeded=true
              break
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              break
            fi

            echo "Push attempt ${attempt} failed; refreshing the target branch before retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::The remote branch changed incompatibly. The local database commit was not pushed."
              exit 75
            fi
          done

          if [[ "${push_succeeded}" != "true" ]]; then
            echo "::error::A broker-state database commit was created locally but could not be pushed. Download the recovery artifact before rerunning."
            exit 75
          fi
          echo "Persisted trades.db commit $(git rev-parse --short HEAD)."

      - name: Preserve database recovery artifact
        id: recovery
        if: always() && (steps.market.outputs.run_mode == 'paper-trade' || steps.market.outputs.run_mode == 'reconcile-only') && hashFiles('trades.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trades-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: trades.db
          if-no-files-found: error
          retention-days: 30

      - name: Propagate trading failure
        if: always() && steps.trading.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The PAPER trading workflow reported an operational failure. Ledger persistence and recovery artifact steps were still attempted."
          exit 1
